<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ftre Queue UI Preview</title>
  <style>
    :root {
      --page: #ffffff;
      --panel: #f3f4f6;
      --text: #333333;
      --muted: #777777;
      --faint: #a6a8ad;
      --border: rgba(0, 0, 0, .12);
      --hover: rgba(0, 0, 0, .055);
      --green: #059669;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: end center;
      padding: 24px;
      color: var(--text);
      background: var(--page);
      font: 14px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .composer {
      position: relative;
      width: min(760px, 100%);
    }

    /* QueueItem 与输入框共用同一个 Surface，不再透出页面白底。 */
    .queue-stack {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 0 14px;
      position: relative;
      z-index: 2;
    }

    .queue-item {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
      min-height: 38px;
      gap: 8px;
      padding: 6px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 14px 14px 0 0;
      color: var(--muted);
    }

    .queue-item + .queue-item {
      border-top: 1px solid rgba(0, 0, 0, .045);
      border-radius: 0;
    }

    .queue-icon {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 14px;
    }

    .queue-label {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--muted);
    }

    .queue-time {
      color: var(--faint);
      font-size: 12px;
      white-space: nowrap;
    }

    .queue-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 0 0 auto;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
      background: transparent;
      font: inherit;
    }

    .action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 28px;
      padding: 0 7px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
    }

    .action.icon-only {
      width: 28px;
      justify-content: center;
      padding: 0;
      font-size: 15px;
    }

    .action:hover { background: var(--hover); color: var(--text); }

    .menu {
      position: absolute;
      top: 34px;
      right: 0;
      z-index: 20;
      display: none;
      width: 132px;
      padding: 5px;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 10px 26px rgba(15, 23, 42, .16);
    }

    .menu.open { display: block; }

    .menu button {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 8px;
      padding: 8px 9px;
      border-radius: 8px;
      text-align: left;
      color: var(--text);
      font-size: 12px;
    }

    .menu button:hover { background: var(--hover); }

    .input-panel {
      position: relative;
      min-height: 116px;
      overflow: visible;
      margin-top: 0;
      padding: 14px 18px 10px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 2px 12px rgba(15, 23, 42, .08);
    }

    .input-panel textarea {
      display: block;
      width: 100%;
      height: 57px;
      resize: none;
      outline: 0;
      border: 0;
      color: var(--text);
      background: transparent;
      font: inherit;
    }

    .input-panel textarea::placeholder { color: #b4b6ba; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 30px;
      color: var(--muted);
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .access { color: #f97316; font-size: 12px; }
    .model { color: var(--text); font-size: 12px; }
    .send {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 50%;
      color: #ffffff;
      background: #262626;
      font-size: 14px;
    }

    .note {
      position: fixed;
      top: 18px;
      left: 18px;
      color: #888;
      font-size: 12px;
    }

    @media (max-width: 620px) {
      body { padding: 12px; }
      .queue-time { display: none; }
      .action:not(.icon-only) { width: 28px; padding: 0; justify-content: center; font-size: 0; }
    }
  </style>
</head>
<body>
  <div class="note">Queue UI preview · 点击 ⋯ 查看更多操作</div>

  <main class="composer" aria-label="消息输入区">
    <section class="queue-stack" aria-label="消息队列">
      <article class="queue-item">
        <span class="queue-icon" aria-hidden="true">↪</span>
        <span class="queue-label" title="还是有色差 直接重构代码！！！！">还是有色差 直接重构代码！！！！</span>
        <span class="queue-time">· 3m38s</span>
        <div class="queue-actions">
          <button class="action" type="button" title="调整方向">↪ <span>调整方向</span></button>
          <button class="action icon-only" type="button" title="删除">⌫</button>
          <button class="action icon-only more" type="button" title="更多操作" aria-expanded="false">⋯</button>
          <div class="menu" role="menu">
            <button type="button" role="menuitem">✎ <span>编辑消息</span></button>
          </div>
        </div>
      </article>
    </section>

    <section class="input-panel">
      <textarea placeholder="随心输入" aria-label="消息输入"></textarea>
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="action icon-only" type="button" title="添加">＋</button>
          <span class="access">⚠ 完全访问</span>
        </div>
        <div class="toolbar-right">
          <span aria-hidden="true">◔</span>
          <span class="model">5.6 Luna <span style="color:#999">极高⌄</span></span>
          <button class="action icon-only" type="button" title="语音输入">♩</button>
          <button class="send" type="button" title="停止">■</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const more = document.querySelector('.more');
    const menu = document.querySelector('.menu');
    more.addEventListener('click', (event) => {
      event.stopPropagation();
      const open = menu.classList.toggle('open');
      more.setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', () => {
      menu.classList.remove('open');
      more.setAttribute('aria-expanded', 'false');
    });
  </script>
</body>
</html>
