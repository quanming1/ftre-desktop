name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout desktop
        uses: actions/checkout@v4

      - name: Checkout ftre
        uses: actions/checkout@v4
        with:
          repository: quanming1/ftre
          path: ftre

      - name: Checkout cordis-py
        uses: actions/checkout@v4
        with:
          repository: quanming1/cordis-py
          path: cordis-py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Bundle backend (Windows x64)
        env:
          FTRE_ROOT: ${{ github.workspace }}\ftre
          CORDIS_ROOT: ${{ github.workspace }}\cordis-py
          PIP_INDEX_URL: https://pypi.org/simple
        run: node scripts/bundle-backend.js --clean --platform win32 --arch x64

      - name: Verify bundled Windows runtime
        shell: pwsh
        run: |
          $manifest = Get-Content backend/manifest.json | ConvertFrom-Json
          if ($manifest.platform -ne 'win32' -or $manifest.arch -ne 'x64') { throw 'Windows runtime manifest mismatch' }
          $env:PYTHONPATH = "${{ github.workspace }}\backend\server"
          $env:PYTHONUTF8 = '1'
          backend/python/python.exe -c "import cordis, ftre, ftre_agent, ftre_agent_runtime; print('bundled runtime ok')"

      - name: Build and package Windows x64
        run: npm run dist:full -- --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ftre-windows-x64
          if-no-files-found: error
          path: |
            release/*Setup*.exe
            release/*Setup*.exe.blockmap

  build-macos:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 runners are no longer reliably schedulable; macos-14 can
          # cross-build the Intel target while keeping the two-architecture matrix.
          - runner: macos-14
            arch: x64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout desktop
        uses: actions/checkout@v4

      - name: Checkout ftre
        uses: actions/checkout@v4
        with:
          repository: quanming1/ftre
          path: ftre

      - name: Checkout cordis-py
        uses: actions/checkout@v4
        with:
          repository: quanming1/cordis-py
          path: cordis-py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Bundle backend (macOS ${{ matrix.arch }})
        env:
          FTRE_ROOT: ${{ github.workspace }}/ftre
          CORDIS_ROOT: ${{ github.workspace }}/cordis-py
          PIP_INDEX_URL: https://pypi.org/simple
        run: node scripts/bundle-backend.js --clean --platform darwin --arch ${{ matrix.arch }}

      - name: Verify bundled macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x backend/python/bin/python3.12
          # macos-14 runner 是 arm64；Intel 产物在该 runner 上交叉构建，
          # 因此不能用宿主 uname 判断目标架构，必须检查实际 runtime 二进制。
          runtime_arch=$(file backend/python/bin/python3.12)
          if [ "${{ matrix.arch }}" = "x64" ]; then
            echo "$runtime_arch" | grep -Eq 'x86_64|universal'
          else
            echo "$runtime_arch" | grep -Eq 'arm64|universal'
          fi
          python3 -c "import json; m=json.load(open('backend/manifest.json')); assert m['platform']=='darwin' and m['arch']=='${{ matrix.arch }}'"
          PYTHONPATH="$GITHUB_WORKSPACE/backend/server" \
            PYTHONUTF8=1 backend/python/bin/python3.12 \
            -c "import cordis, ftre, ftre_agent, ftre_agent_runtime; print('bundled runtime ok')"

      - name: Build and package macOS ${{ matrix.arch }}
        run: pnpm build && pnpm exec electron-builder --mac --${{ matrix.arch }} -c electron-builder-full.json --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ftre-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*mac-${{ matrix.arch }}.dmg
            release/*mac-${{ matrix.arch }}.zip

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Upload all artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            macOS 安装包按 CPU 架构分别提供：x64（Intel）与 arm64（Apple Silicon）。
            安装包内置对应架构的 Python runtime，不要求用户预装开发环境。
            当前构建的签名/notarization 状态以本次 CI 的实际配置和产物为准。
