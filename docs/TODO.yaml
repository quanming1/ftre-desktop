# TODO.yaml — ftre-desktop 桌面客户端功能阶段规划
# 状态图例：done 已完成 · in_progress 进行中 · todo 未开始
# PRD 驱动：每个阶段开工前先写 PRD（docs/prd/PRD-<阶段>-<名称>.md），流程见 docs/PROCESS.md。
# 消费方：.githooks/check_commit_msg.py 校验 feat/fix 的 scope 阶段标识真实存在。

meta:
  project: ftre-desktop
  status_legend:
    done: 已完成
    in_progress: 进行中
    todo: 未开始

stages:
  - id: A
    name: 基础架构
    steps:
      - id: A1
        title: Electron 脚手架
        status: done
        date: 2026-08-12
        prd: docs/prd/PRD-A1-electron-scaffold.md
        prd_status: 已验收
        modules:
          - packages/electron（main.ts / preload.ts / window.ts / backend.ts）
          - packages/renderer（Vite + React app）
          - packages/shared（共享类型）
          - packages/ui（UI 组件库）
        acceptance: pnpm dev 启动，Electron 窗口显示，IPC 通信正常，打包模式 spawn 内嵌 Python 后端

      - id: A2
        title: 聊天界面
        status: done
        date: 2026-08-12
        prd: docs/prd/PRD-A2-chat-ui.md
        prd_status: 已验收
        modules:
          - ChatPanel / ChatMessageList / ChatInput
          - AssistantMessage / UserMessage / CodeBlock / InlineToolCallCard
          - streamingMarkdown
        acceptance: 消息正确渲染，流式输出无闪烁，工具卡片可折叠，代码高亮正确

      - id: A3
        title: Inspector 面板
        status: done
        date: 2026-08-12
        prd: docs/prd/PRD-A3-inspector.md
        prd_status: 已验收
        modules:
          - InspectorPanel
          - DiffRenderer / FileRenderer / ImageRenderer
          - tabRegistry / FileTreeSidebar
        acceptance: read 工具打开 file tab，edit/write 打开 diff tab，图片可预览，tab 可拖拽排序

      - id: A4
        title: 文件树 + Git 集成
        status: done
        date: 2026-08-12
        prd: docs/prd/PRD-A4-file-tree-git.md
        prd_status: 已验收
        modules:
          - InspectorPanel / FileTreeSidebar
          - GitService / git poll / Changes 节点
        acceptance: 文件树正确展示，git 状态染色，Changes 节点 diff 预览，文件操作正常

      - id: A5
        title: Inspector 终端 Tab
        status: in_progress
        date: 2026-08-21
        prd: docs/prd/PRD-A5-inspector-terminal-tab.md
        prd_status: 开发中
        modules:
          - packages/renderer/src/features/inspector/InspectorPanel.tsx
          - packages/renderer/src/stores/inspector.ts
          - packages/renderer/src/features/terminal/TerminalManager.tsx
          - packages/renderer/src/app/TitleBar.tsx
        acceptance: Inspector tabs 右侧 + 菜单可创建终端 Tab，终端内容可交互展示，Header 原终端入口迁移完成

      - id: A6
        title: Inspector 审计 Tab
        status: in_progress
        date: 2026-08-21
        prd: docs/prd/PRD-A6-inspector-audit-tab.md
        prd_status: 开发中
        modules:
          - packages/renderer/src/features/inspector/AuditRenderer.tsx
          - packages/renderer/src/features/inspector/InspectorPanel.tsx
          - packages/renderer/src/features/chat/RunContextPopover.tsx
          - packages/renderer/src/features/chat/TurnFileChanges.tsx
          - packages/renderer/src/features/chat/ChatMessageList.tsx
          - packages/renderer/src/features/session/SessionPanel.tsx
          - packages/renderer/src/stores/inspector.ts
        acceptance: 运行详情 Changes 常驻并按工作区复用审阅 Tab；本轮修改/消息审查按工作区与轮次复用或新建轮次 Tab；工作区新建只激活已有审阅；Tab 标题带工作区名；审阅页支持上一轮、未提交/未暂存/已暂存/未跟踪、展开文件 diff、复制和打开源文件

  - id: B
    name: 协议与可观测
    steps:
      - id: B1
        title: WS 协议 + mailbox 适配
        status: done
        date: 2026-08-12
        prd: docs/prd/PRD-B1-ws-mailbox.md
        prd_status: 已验收
        modules:
          - websocket-client / chat store / session store
          - clientSessionProjection / durable admission / outbox
          - QueuedMessagesBanner
        acceptance: mailbox 快照正确渲染，断线消息不丢失，队列横幅显示 pending，取消排队消息生效

      - id: B2
        title: WS Log 审计日志
        status: done
        date: 2026-08-12
        prd: docs/prd/PRD-B2-ws-log.md
        prd_status: 已验收
        modules:
          - ws-log-collector / ws-log IPC
          - WsLogInspectorPanel / Inspector WS Logs tab
        acceptance: WS 帧被正确采集，Inspector WS Logs tab 可查询，日志文件持久化

  - id: C
    name: 扩展功能
    steps:
      - id: C1
        title: 设置与扩展面板
        status: done
        date: 2026-08-12
        prd: docs/prd/PRD-C1-settings-extensions.md
        prd_status: 已验收
        modules:
          - features/settings/SettingsPanel
          - McpPopover / MCP 管理视图
          - terminal / global-search
        acceptance: 设置可持久化，终端可交互，搜索结果正确，MCP 服务器列表可刷新

  - id: D
    name: 会话体验
    steps:
      - id: D1
        title: 会话内容搜索
        status: done
        date: 2026-08-20
        prd: docs/prd/PRD-D1-session-search.md
        prd_status: 已验收
        modules:
          - packages/renderer/src/features/session/SessionSearchResults.tsx
          - packages/renderer/src/features/session/SessionPanel.tsx
        acceptance: 会话面板顶部搜索框，防抖调后端 /sessions/search，结果高亮命中词与摘要，点击跳转会话，Esc/清空退出搜索

      - id: D2
        title: 会话消息历史定位导航
        status: done
        date: 2026-08-20
        prd: docs/prd/PRD-D2-message-history-navigation.md
        prd_status: 已验收
        modules:
          - packages/renderer/src/features/chat/ChatOutline.tsx
          - packages/renderer/src/features/chat/ChatMessageList.tsx
          - packages/renderer/src/features/chat/ChatHeader.tsx
        acceptance: 消息列表左侧中部展示所有已加载用户消息的定位标记；悬停或聚焦显示摘要，点击定位对应消息；Header 不再显示旧会话目录入口；窄窗口不遮挡正文

      - id: D3
        title: 运行详情弹窗
        status: done
        date: 2026-08-20
        prd: docs/prd/PRD-D3-run-context-popover.md
        prd_status: 已验收
        modules:
          - packages/renderer/src/features/chat/RunContextPopover.tsx
          - packages/renderer/src/features/chat/ChatHeader.tsx
          - packages/renderer/src/features/chat/ChatView.tsx
        acceptance: pending messages 仍显示在输入框上方；运行状态、模型、时长、任务、文件变更、Git 分支与 Git 变更迁移到 Header 右上角弹窗；详情可展开且两类 Diff 都可打开

  - id: E
    name: 跨平台发布
    steps:
      - id: E1
        title: Mac 客户端打包适配
        status: in_progress
        prd: docs/prd/PRD-E1-mac-client-packaging.md
        prd_status: 开发中
        modules:
          - package.json
          - electron-builder-full.json
          - packages/electron/src/backend.ts
          - packages/electron/src/backend-runtime.ts
          - packages/electron/src/main.ts
          - packages/electron/src/ipc/
          - scripts/bundle-backend.js
          - scripts/start-gateway.sh
          - .github/workflows/release.yml
          - packages/renderer/
          - packages/shared/
          - scripts/tests/
        acceptance: Mac Intel 与 Apple Silicon 均可构建并安装 .dmg/.zip；普通用户无需预装 Python、Node.js、Homebrew、conda、Git 或项目源码；每个架构的安装包都携带可离线分发且架构匹配的 Python runtime；内置 Gateway 自动启动；中文文本、UTF-8 编码、路径和文件分隔符全链路正确；Windows 构建不回归；GitHub Release 自动上传 Mac 安装包、校验和与版本说明
