        tasks:
          - id: B4.1
            title: message_id 协议与 reducer 基线
            status: done
          - id: B4.2
            title: 删除 split helper 并迁移 A/U/B 投影
            status: done
          - id: B4.3
            title: Queue/User 双状态与重连乱序测试
            status: done
          - id: B4.4
