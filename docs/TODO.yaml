# TODO.yaml — ftre-desktop 桌面客户端功能阶段规划
# 状态图例：done 已完成 · in_progress 进行中 · todo 未开始
# PRD 驱动：每个阶段开工前先写 PRD（docs/prd/PRD-<阶段>-<名称>.md），流程见 docs/PROCESS.md。
# 消费方：.githooks/check_commit_msg.py 校验 feat/fix 的 scope 阶段标识真实存在。

meta:
  project: ftre-desktop
  status_legend:
    done: 已完成
    in_progress: 进行中
    todo: 未开始

stages:
  - id: A
    name: 基础架构
    steps:
      - id: A1
        title: Electron 脚手架
        status: done
        date: 2026-08-12
        prd: docs/prd/PRD-A1-electron-scaffold.md
        prd_status: 已验收
        modules:
          - packages/electron（main.ts / preload.ts / window.ts / backend-supervisor.ts）
          - packages/renderer（Vite + React app）
          - packages/shared（共享类型）
          - packages/ui（UI 组件库）
        acceptance: pnpm dev 启动，Electron 窗口显示，IPC 通信正常，打包模式 spawn 内嵌 Python 后端

      - id: A2
        title: 聊天界面
        status: done
        date: 2026-08-12
        prd: docs/prd/PRD-A2-chat-ui.md
        prd_status: 已验收
        modules:
