        modules:
          - packages/renderer/src/services/websocket-client.ts
          - packages/renderer/src/stores/chat.ts
          - packages/renderer/src/features/chat/QueuedMessagesBanner.tsx
        acceptance: 普通消息先进入 queued；用户点击按钮后同一 request_id 升级为 steering；Tool 完成后 USER_MESSAGE 先进入 MessageList，队列随后消失；断线/乱序/重复事件不造成视觉空窗；pnpm test、tsc 和跨仓 Gateway smoke 通过
        tasks:
          - id: B3.1
            title: placement 与 queue→steer 投影
            status: done
          - id: B3.2
            title: Steering 按钮、ACK 与失败重试
            status: done
          - id: B3.3
            title: USER_MESSAGE/队列无空窗交接
            status: done
          - id: B3.4
            title: 客户端回归、类型检查与跨仓 E2E
            status: done

