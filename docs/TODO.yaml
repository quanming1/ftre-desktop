          - packages/renderer/src/stores/chat.ts
          - packages/renderer/src/stores/clientSessionProjection.ts
          - packages/renderer/src/features/chat/QueuedMessagesBanner.tsx
        acceptance: 操作成功响应直接提供 queue snapshot；客户端删除独立 Message ACK 解析和本地双阶段 ACK 状态机；普通 queue/steer 的 placement 由 response payload 立即更新；claim/USER_MESSAGE 乱序仍无空窗；服务端 revision 防止旧快照覆盖新快照；旧数据缺 message_id 不再兼容；全量 renderer test、tsc、build 和跨仓协议测试通过
        tasks:
